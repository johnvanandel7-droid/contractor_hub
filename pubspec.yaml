name: contractor_hub
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  
  # firebase and auth dependencies
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  firebase_messaging: ^17.0.0
  firebase_core: ^5.0.0
  cloud_functions: ^7.0.0

  # animation
  animated_text_kit: ^4.3.0
  modal_progress_hud_nsn: ^0.5.1

  # State management
  provider: ^6.1.5

  # Payment Processing
  flutter_stripe: ^14.0.0

  # location
  geolocator: ^14.0.2
  geo_currencies: ^0.0.6
  
  # other
  timeago: ^3.7.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  flutter_contacts: ^2.6.0
  fl_chart: ^1.1.1

  #images
  image_picker: ^1.2.1
  url_launcher: ^6.3.3
  firebase_storage: ^14.0.0
  cached_network_image: ^4.0.4
  shared_preferences: ^2.5.6
  native_geofence: ^1.0.0
  flutter_local_notifications: ^22.3.2
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  

flutter:
  uses-material-design: true

  assets:
    - images/